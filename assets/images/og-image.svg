<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 627" width="1200" height="627" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>GuardNous — Defend What Matters. Scan code. Check your cloud. Fix with approval.</title>
  <defs>
    <radialGradient id="glow" cx="78%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="approve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="#0c0a09"/>
  <rect width="1200" height="627" fill="url(#glow)"/>

  <!-- Left: brand, tagline, one-line description -->
  <g id="left">
    <image xlink:href="logo.svg" href="logo.svg" x="70" y="62" width="72" height="72"/>
    <text x="160" y="100" font-size="40" font-weight="700" fill="#ffffff">GuardNous</text>
    <text x="161" y="128" font-size="17" font-weight="600" fill="#fb923c" letter-spacing="2.5">DEFEND WHAT MATTERS</text>

    <text x="70" y="262" font-size="58" font-weight="800" fill="#ffffff">Scan code.</text>
    <text x="70" y="334" font-size="58" font-weight="800" fill="#ffffff">Check your cloud.</text>
    <text x="70" y="406" font-size="58" font-weight="800" fill="#fb923c">Fix with approval.</text>

    <text x="72" y="470" font-size="23" fill="#d6d3d1">AI agents propose the fix.</text>
    <text x="72" y="502" font-size="23" fill="#d6d3d1">A person approves the exact change.</text>

    <text x="72" y="566" font-size="19" fill="#a8a29e">Open source  ·  Self-hosted  ·  Apache 2.0</text>
  </g>

  <!-- Right: the approval moment -->
  <g id="card" filter="url(#lift)">
    <rect x="640" y="84" width="490" height="460" rx="18" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>

    <rect x="668" y="112" width="182" height="30" rx="15" fill="#f97316" fill-opacity="0.16" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="759" y="132" font-size="13" font-weight="700" fill="#fdba74" text-anchor="middle" letter-spacing="1.4">APPROVAL NEEDED</text>

    <text x="668" y="182" font-size="25" font-weight="700" fill="#ffffff">Open a fix pull request</text>
    <text x="668" y="210" font-size="15.5" fill="#a8a29e">Proposed by an agent · waiting for a second person</text>

    <rect x="668" y="232" width="434" height="184" rx="12" fill="#0c0a09" stroke="#292524"/>
    <text x="686" y="260" font-size="13.5" fill="#78716c" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">storage.tf</text>
    <text x="686" y="290" font-size="15.5" fill="#d6d3d1" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  resource "aws_s3_bucket" "data" {</text>
    <rect x="669" y="300" width="432" height="28" fill="#ef4444" fill-opacity="0.16"/>
    <text x="686" y="320" font-size="15.5" fill="#fca5a5" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">-   acl = "public-read"</text>
    <rect x="669" y="330" width="432" height="56" fill="#22c55e" fill-opacity="0.14"/>
    <text x="686" y="350" font-size="15.5" fill="#86efac" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">+   acl = "private"</text>
    <text x="686" y="378" font-size="15.5" fill="#86efac" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">+   block_public_acls = true</text>
    <text x="686" y="406" font-size="15.5" fill="#d6d3d1" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  }</text>

    <text x="668" y="448" font-size="15.5" fill="#a8a29e">Nothing changes until someone approves.</text>

    <rect x="668" y="470" width="206" height="50" rx="11" fill="url(#approve)"/>
    <text x="771" y="502" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">Approve</text>
    <rect x="890" y="470" width="212" height="50" rx="11" fill="none" stroke="#57534e" stroke-width="1.5"/>
    <text x="996" y="502" font-size="19" font-weight="600" fill="#d6d3d1" text-anchor="middle">Reject</text>
  </g>
</svg>
