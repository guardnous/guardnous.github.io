<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 627" width="1200" height="627" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>GuardNous — Your scanners. Your model. Your infrastructure. Security AI agents you can audit. The open-source security platform with AI agents built in.</title>
  <defs>
    <radialGradient id="glow" cx="88%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="627" fill="#0c0a09"/>
  <rect width="1200" height="627" fill="url(#glow)"/>

  <!-- Large, faint shield on the right for depth -->
  <image id="mark" xlink:href="logo.svg" href="logo.svg" x="880" y="330" width="330" height="330" opacity="0.10"/>

  <!-- Brand -->
  <g id="brand">
    <image xlink:href="logo.svg" href="logo.svg" x="70" y="56" width="68" height="68"/>
    <text x="154" y="92" font-size="38" font-weight="700" fill="#ffffff">GuardNous</text>
    <text x="155" y="118" font-size="16" font-weight="600" fill="#fb923c" letter-spacing="2.5">DEFEND WHAT MATTERS</text>
  </g>

  <!-- Three statements, one per line -->
  <g id="statements">
    <rect x="70" y="204" width="6" height="216" rx="3" fill="url(#bar)"/>

    <text x="100" y="250" font-size="43" font-weight="800" fill="#ffffff"><tspan fill="#fb923c">Your</tspan> scanners. <tspan fill="#fb923c">Your</tspan> model. <tspan fill="#fb923c">Your</tspan> infrastructure.</text>

    <text x="100" y="330" font-size="40" font-weight="700" fill="#f5f5f4">Security AI agents you can audit.</text>

    <text x="100" y="404" font-size="31" font-weight="500" fill="#d6d3d1">The open-source security platform with AI agents built in.</text>
  </g>

  <!-- Facts -->
  <g id="facts">
    <rect x="70" y="508" width="196" height="46" rx="23" fill="#1c1917" stroke="#44403c"/>
    <text x="168" y="538" font-size="19" font-weight="600" fill="#e7e5e4" text-anchor="middle">Free and open</text>
    <rect x="282" y="508" width="172" height="46" rx="23" fill="#1c1917" stroke="#44403c"/>
    <text x="368" y="538" font-size="19" font-weight="600" fill="#e7e5e4" text-anchor="middle">Self-hosted</text>
    <rect x="470" y="508" width="262" height="46" rx="23" fill="#1c1917" stroke="#44403c"/>
    <text x="601" y="538" font-size="19" font-weight="600" fill="#e7e5e4" text-anchor="middle">Bring your own model</text>
    <rect x="748" y="508" width="166" height="46" rx="23" fill="#1c1917" stroke="#44403c"/>
    <text x="831" y="538" font-size="19" font-weight="600" fill="#e7e5e4" text-anchor="middle">Apache 2.0</text>
  </g>
</svg>
